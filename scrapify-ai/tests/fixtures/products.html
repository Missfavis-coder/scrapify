<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scrapify Product Test</title>
</head>
<body>
    <h1>Products</h1>

    <article class="product">
        <h2>Canvas Backpack</h2>
        <span class="price">$29.99</span>
        <a href="https://example.com/backpack">View product</a>
        <img src="https://example.com/backpack.jpg" alt="Canvas Backpack">

    <article class="product">
        <h2>Leather Handbag</h2>
        <span class="price">$49.99</span>
        <a href="https://example.com/handbag">View product</a>

    <article class="product">
        <h2>Travel Tote</h2>
        <span class="price">$19.99</span>
        <a href="https://example.com/tote">View product</a>

    </article>

</html>
